# Builds the Windows installer and publishes it as a GitHub Release whenever a
# version tag is pushed (v0.2.0, v1.0.0 …). Installed desktops read the
# release's latest.json through the Tauri updater and offer the update.
#
# Secrets (repo → Settings → Secrets and variables → Actions):
#   TAURI_SIGNING_PRIVATE_KEY            — updater signing key (Nathan generates; never leaves GitHub)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD   — its password (may be empty)
#   VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY — baked into the build (anon key only; public by design)
#   VITE_SUBSCRIPTION_PUBLIC_KEY         — Ed25519 public key for offline subscription tokens
name: Release desktop

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - run: npm ci

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SUBSCRIPTION_PUBLIC_KEY: ${{ secrets.VITE_SUBSCRIPTION_PUBLIC_KEY }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "Zogal ${{ github.ref_name }}"
          releaseBody: "See the commit log for what changed. Installed apps update themselves."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
