# Builds the Windows installer and macOS apps (Apple Silicon + Intel) and publishes it as a GitHub Release whenever a
# version tag is pushed (v0.2.0, v1.0.0 …). Installed desktops read the
# release's latest.json through the Tauri updater and offer the update.
#
# Secrets (repo → Settings → Secrets and variables → Actions):
#   TAURI_SIGNING_PRIVATE_KEY            — updater signing key (Nathan generates; never leaves GitHub)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD   — its password (may be empty)
#   VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY — baked into the build (anon key only; public by design)
#   VITE_SUBSCRIPTION_PUBLIC_KEY         — Ed25519 public key for offline subscription tokens
name: Release desktop

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          # Apple Silicon and Intel. Unsigned until Nathan has an Apple
          # Developer ID (then add APPLE_* secrets — see docs/RELEASING.md);
          # unsigned builds open with right-click → Open the first time.
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - run: npm ci

      # macOS signing is optional. Tauri signs whenever APPLE_CERTIFICATE is
      # merely PRESENT, so an empty secret must not be exported at all —
      # exporting it broke the first Mac build. Set the variables only when
      # Nathan has added an Apple Developer certificate.
      - name: Enable Apple signing (only if secrets exist)
        if: runner.os == 'macOS' && env.HAS_CERT != ''
        env:
          HAS_CERT: ${{ secrets.APPLE_CERTIFICATE }}
        run: |
          {
            echo "APPLE_CERTIFICATE=${{ secrets.APPLE_CERTIFICATE }}"
            echo "APPLE_CERTIFICATE_PASSWORD=${{ secrets.APPLE_CERTIFICATE_PASSWORD }}"
            echo "APPLE_SIGNING_IDENTITY=${{ secrets.APPLE_SIGNING_IDENTITY }}"
            echo "APPLE_ID=${{ secrets.APPLE_ID }}"
            echo "APPLE_PASSWORD=${{ secrets.APPLE_PASSWORD }}"
            echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}"
          } >> "$GITHUB_ENV"

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SUBSCRIPTION_PUBLIC_KEY: ${{ secrets.VITE_SUBSCRIPTION_PUBLIC_KEY }}
        with:
          args: ${{ matrix.args }}
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "Doka ${{ github.ref_name }}"
          releaseBody: "See the commit log for what changed. Installed apps update themselves."
          # DRAFT until every platform has built (see the publish job below).
          # Windows, Mac-arm and Mac-intel build in parallel and each one
          # merges its own entry into latest.json and re-uploads it. A
          # non-draft release is "latest" (and visible to the updater and
          # the marketing site) the instant the FIRST of the three finishes
          # — so for the several minutes until the slowest build lands,
          # anyone checking for updates saw an incomplete latest.json and a
          # confusing raw error. Keeping it a draft hides it from all of
          # that until the whole set is in.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release now that every platform has built
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --repo "${{ github.repository }}" --draft=false
